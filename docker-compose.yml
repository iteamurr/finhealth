services:
  postgres:
    image: postgres:16-alpine
    container_name: finhealth-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finhealth}
      POSTGRES_DB: ${POSTGRES_DB:-finhealth}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finhealth} -d ${POSTGRES_DB:-finhealth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: finhealth-app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finhealth}:${POSTGRES_PASSWORD:-finhealth}@postgres:5432/${POSTGRES_DB:-finhealth}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn finhealth.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
