[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finhealth"
version = "0.1.0"
description = "Financial health analyzer for Russian marketplace sellers (Wildberries, Ozon)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic>=2.0",
    "punq",
    "faker",
    "uvicorn",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["finhealth*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
